name: atm-sci-container CI

permissions:
  contents: read

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - develop
      - master
    tags:
      - '[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]'
  workflow_dispatch:
    inputs:
      build:
        description: 'Build string'
        required: true
        type: string
        default: ''
      version:
        description: 'Version string'
        required: true
        type: string
        default: ''
      push:
        description: 'Push container images'
        required: false
        type: boolean
        default: false
      push-latest:
        description: 'Push latest container images'
        required: false
        type: boolean
        default: false

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }} - ${{ github.ref }}

jobs:
  configure-pipeline:
    name: Configure pipeline
    runs-on: ubuntu-slim
    outputs:
      build: ${{ steps.configurator.outputs.build }}
      version: ${{ steps.configurator.outputs.version }}
      push: ${{ steps.configurator.outputs.push }}
      push-latest: ${{ steps.configurator.outputs.push-latest }}
      compiler: ${{ steps.configurator.outputs.compiler }}
      mpi: ${{ steps.configurator.outputs.mpi }}
      gpu: ${{ steps.configurator.outputs.gpu }}
    timeout-minutes: 1
    steps:
      - name: Configure pipeline
        id: configurator
        run: |
          set -euo pipefail

          write_output_and_exit() {
            # Write default values.
            echo "build=" >> "${GITHUB_OUTPUT}"
            echo "version=" >> "${GITHUB_OUTPUT}"
            echo "push=false" >> "${GITHUB_OUTPUT}"
            echo "push-latest=false" >> "${GITHUB_OUTPUT}"
            echo "compiler=" >> "${GITHUB_OUTPUT}"
            echo "mpi=" >> "${GITHUB_OUTPUT}"
            echo "gpu=" >> "${GITHUB_OUTPUT}"

            # Overwrite values according to the provided arguments.
            while [ "${#}" -gt 0 ]; do
              case "${1}" in
                --build)
                  # Sanitize input.
                  BUILD="$(echo "${2}" | \
                    sed -E -e "s|[^A-Za-z0-9_-]||g")"

                  case "${BUILD}" in
                    all)
                      echo "build=all" | tee -a "${GITHUB_OUTPUT}"
                      ;;
                    *)
                      # Sanitize input.
                      COMPILER="$(echo "${BUILD}" | \
                        cut -d _ -f 1 | \
                        sed -E -e "s|^ *-*||g")"
                      MPI="$(echo "${BUILD}" | \
                        cut -d _ -f 2 | \
                        sed -E -e "s|^ *-*||g")"
                      GPU="$(echo "${BUILD}" | \
                        cut -d _ -f 3 | \
                        sed -E -e "s|^ *-*||g")"

                      if [ -z "${COMPILER}" ] || [ -z "${MPI}" ] || [ -z "${GPU}" ]; then
                        echo "Build string is invalid."

                        exit 1
                      fi

                      echo "build=custom" | tee -a "${GITHUB_OUTPUT}"
                      echo "compiler=${COMPILER}" | tee -a "${GITHUB_OUTPUT}"
                      echo "mpi=${MPI}" | tee -a "${GITHUB_OUTPUT}"
                      echo "gpu=${GPU}" | tee -a "${GITHUB_OUTPUT}"

                      unset COMPILER
                      unset MPI
                      unset GPU
                      ;;
                  esac

                  unset BUILD
                  shift
                  shift
                  ;;
                --version)
                  # Sanitize input.
                  VERSION="$(echo "${2}" | \
                    sed -E -e "s|[^A-Za-z0-9_-]||g" -e "s|^ *-*||g")"

                  echo "version=${VERSION}" | tee -a "${GITHUB_OUTPUT}"

                  unset VERSION
                  shift
                  shift
                  ;;
                --push)
                  echo "push=true" | tee -a "${GITHUB_OUTPUT}"
                  shift
                  ;;
                --push-latest)
                  echo "push-latest=true" | tee -a "${GITHUB_OUTPUT}"
                  shift
                  ;;
                error|*)
                  echo "Error occurred!"

                  exit 1
                  ;;
              esac
            done

            exit 0
          }

          case "${{ github.event_name }}" in
            pull_request)
              echo "Event is pull request."

              case "${{ github.base_ref }}" in
                develop)
                  echo "Target branch is develop."

                  write_output_and_exit \
                    --build gnu-11_open-mpi-5_none \
                    --version testing
                  ;;
                master)
                  echo "Target branch is master."

                  write_output_and_exit \
                    --build all \
                    --version testing
                  ;;
                *)
                  echo "Target branch is unknown."

                  write_output_and_exit
                  ;;
              esac
              ;;
            push)
              echo "Event is push."

              case "${{ github.ref }}" in
                refs/heads/develop)
                  echo "Pushed ref is develop branch."

                  write_output_and_exit \
                    --build gnu-11_open-mpi-5_none \
                    --version testing
                  ;;
                refs/heads/master)
                  echo "Pushed ref is master branch."

                  write_output_and_exit \
                    --build all \
                    --version testing
                  ;;
                *)
                  if echo "${{ github.ref }}" | grep -E -q '^refs/tags/[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
                    echo "Pushed ref is release version tag."

                    write_output_and_exit \
                      --build all \
                      --version "$(echo "${{ github.ref }}" | sed -E -e "s|^refs/tags/||g")" \
                      --push \
                      --push-latest
                  else
                    echo "Pushed ref is unknown."

                    write_output_and_exit
                  fi
                  ;;
              esac
              ;;
            workflow_dispatch)
              echo "Event is workflow dispatch."

              set --

              if [ "${{ inputs.push }}" = "true" ]; then
                set -- "${@}" "--push"

                if [ "${{ inputs.push-latest }}" = "true" ]; then
                  set -- "${@}" "--push-latest"
                fi
              fi

              write_output_and_exit \
                --build "${{ inputs.build }}" \
                --version "${{ inputs.version }}" \
                "${@}"
              ;;
            *)
              echo "Event is invalid."

              write_output_and_exit error
              ;;
          esac
  build-push:
    name: Build and push container images
    permissions:
      contents: read
      packages: write
    needs: configure-pipeline
    if: ${{ needs.configure-pipeline.outputs.build != '' && needs.configure-pipeline.outputs.version != '' }}
    runs-on: self-hosted
    env:
      BUILDX_NO_DEFAULT_ATTESTATIONS: 1
      # ----------
      DOCKER_HUB_REGISTRY: docker.io
      GITHUB_PACKAGE_REGISTRY: ghcr.io
      NAMESPACE: kuanchihwang
      # ----------
      BUILD: ${{ needs.configure-pipeline.outputs.build }}
      VERSION: ${{ needs.configure-pipeline.outputs.version }}
      COMPILER: ${{ needs.configure-pipeline.outputs.compiler }}
      MPI: ${{ needs.configure-pipeline.outputs.mpi }}
      GPU: ${{ needs.configure-pipeline.outputs.gpu }}
    timeout-minutes: 1440
    steps:
      - name: Checkout atm-sci-container
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ${{ env.DOCKER_HUB_REGISTRY }}
          username: ${{ env.NAMESPACE }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Package
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GITHUB_PACKAGE_REGISTRY }}
          username: ${{ env.NAMESPACE }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull data container images
        run: |
          set -euo pipefail

          make stage

      - name: Build container images
        run: |
          set -euo pipefail

          case "${BUILD}" in
            all)
              ./.github/scripts/build-all.sh build "${VERSION}"
              ;;
            custom)
              mkdir -p logs
              make build \
                VERSION="${VERSION}" \
                COMPILER="${COMPILER}" \
                MPI="${MPI}" \
                GPU="${GPU}" \
                2>&1 | tee "logs/build_custom.log" | \
                { grep -E --line-buffered '^\[[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z\] ' || true; }
              ;;
            *)
              exit 1
              ;;
          esac

      - name: Login to Docker Hub
        if: ${{ needs.configure-pipeline.outputs.push == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.DOCKER_HUB_REGISTRY }}
          username: ${{ env.NAMESPACE }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Package Registry
        if: ${{ needs.configure-pipeline.outputs.push == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GITHUB_PACKAGE_REGISTRY }}
          username: ${{ env.NAMESPACE }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push container images
        if: ${{ needs.configure-pipeline.outputs.push == 'true' }}
        run: |
          set -euo pipefail

          case "${BUILD}" in
            all)
              ./.github/scripts/push-all.sh push "${DOCKER_HUB_REGISTRY}" "${NAMESPACE}" "${VERSION}"
              ./.github/scripts/push-all.sh push "${GITHUB_PACKAGE_REGISTRY}" "${NAMESPACE}" "${VERSION}"
              ;;
            custom)
              make push \
                REGISTRY="${DOCKER_HUB_REGISTRY}" \
                NAMESPACE="${NAMESPACE}" \
                VERSION="${VERSION}" \
                COMPILER="${COMPILER}" \
                MPI="${MPI}" \
                GPU="${GPU}" \
                2>&1 | tee "logs/push_custom.log" | \
                { grep -E --line-buffered '^\[[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z\] ' || true; }
              ;;
            *)
              exit 1
              ;;
          esac

      - name: Push latest container images
        if: ${{ needs.configure-pipeline.outputs.push-latest == 'true' }}
        run: |
          set -euo pipefail

          case "${BUILD}" in
            all)
              ./.github/scripts/push-all.sh push-latest "${DOCKER_HUB_REGISTRY}" "${NAMESPACE}" "${VERSION}"
              ./.github/scripts/push-all.sh push-latest "${GITHUB_PACKAGE_REGISTRY}" "${NAMESPACE}" "${VERSION}"
              ;;
            custom)
              make push-latest \
                REGISTRY="${DOCKER_HUB_REGISTRY}" \
                NAMESPACE="${NAMESPACE}" \
                VERSION="${VERSION}" \
                COMPILER="${COMPILER}" \
                MPI="${MPI}" \
                GPU="${GPU}" \
                2>&1 | tee "logs/push-latest_custom.log" | \
                { grep -E --line-buffered '^\[[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z\] ' || true; }
              ;;
            *)
              exit 1
              ;;
          esac

      - name: Upload build logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: ignore
          name: build-logs
          path: ${{ github.workspace }}/logs/*.log
          retention-days: 7
